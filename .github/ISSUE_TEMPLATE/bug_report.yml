name: Bug report
description: Report a reproducible problem in Cocode.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not use this form. Follow [SECURITY.md](https://github.com/cocode-agency/cocode/blob/main/SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - GUI
        - TUI
        - Host Supervisor
        - Installation / release
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cocode version
      placeholder: "GUI v1.0.0 or @cocode-agency/tui 0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15 arm64, Node 22.19.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest command sequence or project that shows the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant output from `cocode doctor`, `cocode host status --json`, or logs. Remove credentials, tokens, session contents, and private paths first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private session data from this report.
          required: true
